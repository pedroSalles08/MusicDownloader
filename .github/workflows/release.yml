name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências Python
        shell: pwsh
        run: python -m pip install -e ".[dev]"

      - name: Executar testes
        shell: pwsh
        run: python -m pytest -q --basetemp=.pytest-ci

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Gerar instalador e pacote portátil
        shell: pwsh
        run: .\packaging\build_release.ps1 -SkipInstall -SkipTests

      - name: Disponibilizar artefatos do workflow
        uses: actions/upload-artifact@v4
        with:
          name: MusicDownloader-Windows
          path: release/*
          if-no-files-found: error

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (gh release view $tag 2>$null) {
            gh release upload $tag release/* --clobber
          } else {
            gh release create $tag release/* --generate-notes --title "Music Downloader $tag"
          }
